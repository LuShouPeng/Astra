[package]
name = "astra-nexus-workbench"
version = "0.1.0"
description = "Local control plane for deterministic AI coding sessions"
authors = ["Astra Nexus"]
edition = "2021"

[lib]
name = "astra_nexus_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
git2 = "0.20"
rmcp = { version = "3.0.0-beta.2", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
